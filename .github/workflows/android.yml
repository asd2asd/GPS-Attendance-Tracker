name: Android CI

on:
  push:
    branches: [ "commercial_use_version" ]
  pull_request:
    branches: [ "commercial_use_version" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    
    - name: Build with Gradle
      run: ./gradlew build

    
    - name: Upload APK
      uses: actions/upload-artifact@v4.6.2-
      with:
        name: my-build-apk
        path: ./**/*.apk
